<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vercel API 테스트</title>
  <style>
    body {
      margin: 0; padding: 48px 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", sans-serif;
      background: #f4f6fb; color: #14171f;
    }
    main { max-width: 560px; margin: 0 auto; }
    button {
      font: inherit; font-weight: 600; padding: 12px 20px;
      border: 0; border-radius: 10px; background: #2f5bff; color: #fff; cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    #result {
      margin-top: 20px; padding: 16px; min-height: 24px;
      background: #fff; border: 1px solid #e3e7ef; border-radius: 10px;
      font-size: 18px; font-weight: 600;
    }
    pre { margin: 12px 0 0; font-size: 13px; color: #6b7280; white-space: pre-wrap; }
  </style>
</head>
<body>
  <main>
    <h1>Vercel API 연결 테스트</h1>
    <button id="btn">/api/hello 호출</button>
    <div id="result">버튼을 눌러 주세요</div>
    <pre id="raw"></pre>
  </main>
  <script>
    const btn = document.getElementById('btn');
    const result = document.getElementById('result');
    const raw = document.getElementById('raw');
    btn.addEventListener('click', async () => {
      btn.disabled = true;
      result.textContent = '불러오는 중…';
      raw.textContent = '';
      try {
        const res = await fetch('/api/hello');
        const data = await res.json();
        result.textContent = data.message;
        raw.textContent = 'HTTP ' + res.status + '\n' + JSON.stringify(data, null, 2);
      } catch (err) {
        result.textContent = '요청 실패: ' + err.message;
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
